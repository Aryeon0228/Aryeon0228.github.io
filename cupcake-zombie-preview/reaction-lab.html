<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>컵케이크 · 파닥 실험</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e7ddcc;color:#49342e;font:16px/1.5 -apple-system,sans-serif}main{max-width:420px;margin:28px auto;padding:20px}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 20px}canvas{width:100%;aspect-ratio:1;display:block;border:3px solid #584235;border-radius:24px;background:#fff7e7;touch-action:manipulation}button{font:inherit;padding:12px 18px;border:2px solid #584235;border-radius:14px;background:#fff8ec;box-shadow:0 4px #584235;color:#49342e;cursor:pointer}button:active{transform:translateY(3px);box-shadow:0 1px #584235}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}label{display:block;margin:16px 0}input[type=range]{width:100%}.note{font-size:13px;color:#78634f}output{font-variant-numeric:tabular-nums}</style>
<main><h1>앗, 나 불렀어?</h1><p>초코 머핀 · 눈 동그랗게 + 팔 파닥</p><canvas id="sample" width="720" height="720" aria-label="클릭하면 잠깐 놀라는 초코 머핀"></canvas><div class="controls"><button id="play">한 번 파닥!</button><button id="slow">천천히 보기</button></div><label>동작 살펴보기 <output id="age">평소</output><input id="scrub" aria-label="애니메이션 시간" type="range" min="0" max="460" value="460"></label><p class="note">원화의 몸통·컵·토핑은 그대로 두고, 기존 팔과 눈을 따로 움직이는 시안이에요.</p></main>
<script>const IMG={},META={};// Runtime paper-cut rig. The PNG stays untouched; the existing hand-drawn
// pixels are separated into a body, two shoulder-pivoted arms and two eyes.
// Start with the original muffin. Other flavors need their own shoulder/eye
// anchors before they can share this rig and its motion.
const CUPCAKE_RIG_PROFILES = {
  basic: {
    size: [115, 118],
    arms: [
      { pivot: [11, 74], side: 1, cut: [[9.5, 71], [12, 79], [14, 88], [0, 88], [0, 71]] },
      { pivot: [102, 75], side: -1, cut: [[103, 71], [99.5, 78], [96, 89], [115, 89], [115, 71]] }
    ],
    eyes: [{ x: 31, y: 30, rx: 6, ry: 8 }, { x: 79, y: 33, rx: 6, ry: 8 }]
  }
};
const CUPCAKE_RIG_CACHE = {};
function rigCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}
function rigPolygon(g, points) {
  g.beginPath(); points.forEach(([x, y], n) => n ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
}
function prepareCupcakeRig(key) {
  if (CUPCAKE_RIG_CACHE[key]) return CUPCAKE_RIG_CACHE[key];
  const profile = CUPCAKE_RIG_PROFILES[key], im = IMG[key];
  if (!profile || !im || im.width !== profile.size[0] || im.height !== profile.size[1]) return null;
  const body = rigCanvas(im.width, im.height), b = body.getContext('2d');
  b.drawImage(im, 0, 0);
  const arms = profile.arms.map(a => {
    const art = rigCanvas(im.width, im.height), g = art.getContext('2d');
    g.save(); rigPolygon(g, a.cut); g.clip(); g.drawImage(im, 0, 0); g.restore();
    b.save(); b.globalCompositeOperation = 'destination-out'; rigPolygon(b, a.cut); b.fill(); b.restore();
    return { ...a, art };
  });
  const eyes = profile.eyes.map(eye => {
    const art = rigCanvas(eye.rx * 2, eye.ry * 2), g = art.getContext('2d');
    g.drawImage(im, eye.x - eye.rx, eye.y - eye.ry, art.width, art.height, 0, 0, art.width, art.height);
    const pixels = g.getImageData(0, 0, art.width, art.height);
    for (let i = 0; i < pixels.data.length; i += 4) {
      // Preserve the original brown pencil grain; exclude surrounding sponge.
      const r = pixels.data[i], green = pixels.data[i + 1], blue = pixels.data[i + 2];
      if (r > 155 || green > 108 || blue > 90) pixels.data[i + 3] = 0;
    }
    g.putImageData(pixels, 0, 0);
    return { ...eye, art };
  });
  return CUPCAKE_RIG_CACHE[key] = { body, arms, eyes };
}
function cupcakeReactionPose(age, reduced = false) {
  if (reduced || age < 0 || age >= 460) return { active: false, arms: 0, eyes: 1 };
  const t = age / 460;
  const envelope = Math.sin(Math.PI * t) ** 0.8;
  // Two small flaps, with a quiet start and finish. Feet never move.
  return {
    active: true,
    arms: envelope * (0.85 + 0.38 * Math.sin(t * Math.PI * 4)),
    eyes: 1 + 0.42 * Math.sin(Math.PI * Math.min(1, age / 360)) ** 0.7
  };
}
function drawCupcakeReaction(g, key, x, by, sc, sx, sy, age, reduced = false) {
  const pose = cupcakeReactionPose(age, reduced);
  if (!pose.active) return false;
  const rig = prepareCupcakeRig(key), m = META[key];
  if (!rig || !m) return false;
  g.save(); g.translate(x, by); g.scale(sc * (m.k || 1) * sx, sc * (m.k || 1) * sy);
  g.translate(-m.ax, -m.ay);
  for (const arm of rig.arms) {
    g.save(); g.translate(...arm.pivot); g.rotate(arm.side * pose.arms);
    g.drawImage(arm.art, -arm.pivot[0], -arm.pivot[1]); g.restore();
  }
  g.drawImage(rig.body, 0, 0);
  for (const eye of rig.eyes) {
    g.save(); g.translate(eye.x, eye.y); g.scale(pose.eyes, 1 + (pose.eyes - 1) * 0.55);
    g.drawImage(eye.art, -eye.rx, -eye.ry); g.restore();
  }
  g.restore();
  return true;
}

const cv=document.getElementById('sample'),g=cv.getContext('2d'),im=new Image(),slider=document.getElementById('scrub'),ageLabel=document.getElementById('age');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let started=-1,speed=1,frame=null;
function draw(age=460){g.clearRect(0,0,720,720);g.fillStyle='#ddd4bb';g.beginPath();g.ellipse(360,580,160,25,0,0,Math.PI*2);g.fill();if(!drawCupcakeReaction(g,'basic',360,580,3.65,1,1,age,reduced)){g.drawImage(im,360-META.basic.ax*3.65,580-META.basic.ay*3.65,im.width*3.65,im.height*3.65)}slider.value=Math.min(460,Math.max(0,age));ageLabel.textContent=age>=460?'평소':Math.round(age)+'ms';}
function play(s=1){cancelAnimationFrame(frame);speed=s;started=performance.now();function tick(t){const age=(t-started)/speed;draw(age);if(age<460)frame=requestAnimationFrame(tick)}frame=requestAnimationFrame(tick);}
im.onload=()=>{IMG.basic=im;META.basic={ax:56,ay:115,k:1};prepareCupcakeRig('basic');draw();};
