*{box-sizing:border-box}body{margin:0;background:#eee4d3;color:#49342e;font:15px/1.5 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:460px;margin:auto;padding:24px 20px 30px}.eyebrow{font-size:11px;letter-spacing:.15em;font-weight:800;color:#7a7d40;margin:0 0 6px}h1{font-size:28px;line-height:1.2;margin:0 0 8px}.intro{margin:0 0 18px;color:#776151}button{font:inherit;font-weight:750;padding:10px 14px;min-height:44px;border:2px solid #584235;border-radius:13px;background:#fff9eb;box-shadow:0 4px #584235;color:#49342e;cursor:pointer;touch-action:manipulation}button:active{transform:translateY(3px);box-shadow:0 1px #584235}button:focus-visible,input:focus-visible{outline:3px solid #769eac;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}.flavors{display:flex;gap:10px;margin:16px 0}.flavors button[aria-pressed=true]{background:#f7d374}.stage{background:#fff8e9;border:3px solid #584235;border-radius:24px;box-shadow:0 6px #c4ad92;overflow:hidden}canvas{width:100%;aspect-ratio:720/666;display:block;touch-action:manipulation}.caption{margin:0;padding:0 12px 12px;text-align:center;font-size:12px;color:#806c59}.controls{display:flex;gap:10px;margin:20px 0 16px}.controls button{flex:1}.controls .primary{background:#bdd6ad}.toggles{display:flex;gap:8px 16px;flex-wrap:wrap;margin:0 0 16px}.toggles label{display:flex;align-items:center;gap:5px;min-height:32px;font-size:13px;cursor:pointer}input{accent-color:#65824c}input[type=checkbox]{width:17px;height:17px}.scrub{display:block;background:#e4d7c4;border-radius:14px;padding:12px 14px;font-size:12px}.scrub span{display:flex;justify-content:space-between}input[type=range]{width:100%;display:block;margin:10px 0 0}output{font-variant-numeric:tabular-nums}.note{font-size:12px;color:#806c59;margin:16px 0 0}.back{display:inline-block;margin-top:14px;font-size:13px;color:#53713b} @media(max-width:350px){main{padding:16px}h1{font-size:25px}.intro{font-size:13px}.toggles{gap:4px 10px}}@media(prefers-reduced-motion:reduc <main><p class="eyebrow">CUPCAKE ZOMBIE · REACTION LAB</p><h1>버터도, 파닥!</h1><p class="intro">시크한 얼굴로 버티다가… 팔은 솔직하네.</p>
<div class="flavors" role="group" aria-label="반응 선택"><button data-flavor="butter" aria-pressed="true">버터</button><button data-flavor="basic" aria-pressed="false">초코 머핀</button><button data-flavor="zombie" aria-pressed="false">변신 뽀잉</button></div>
<div class="stage"><canvas id="sample" width="720" height="666" aria-label="버터 컵케이크. 아래 버튼으로 반응을 재생할 수 있어요."></canvas><p class="caption" id="caption">분리해 준 원화로 움직여요 · 발 위치는 고정</p></div>
<div class="controls"><button id="play" class="primary" disabled>뽀잉 + 파닥!</button><button id="slow" disabled>천천히 보기</button></div>
<div class="toggles" role="group" aria-label="움직임 비교"><label><input id="bodyMotion" type="checkbox" checked>몸통 뽀잉</label><label><input id="armsMotion" type="checkbox" checked>팔 파닥</label><label><input id="eyesMotion" type="checkbox" checked>눈 깜짝</label></div>
<label class="scrub"><span>동작 살펴보기 <output id="age">불러오는 중</output></span><input id="scrub" aria-label="애니메이션 시간" type="range" min="0" max="460" value="460" disabled></label>
<p class="note" id="note">모자 아래 눈매와 입은 그대로. 따로 준 큰 눈은 깜짝 놀랄 때만 나타나요.</p>
<a class="back" href="./#stage-16">게임에서도 버터 만나기 →</a></main>
<script>const IMG={},META={},TINT={};// Paper-cut rigs share motion but keep each flavor's own artwork and anchors.
// The muffin uses runtime cutouts. Butter uses the artist's untouched layers.
const CUPCAKE_RIG_PROFILES = {
  basic: {
    size: [115, 118],
    arms: [
      { pivot: [11, 74], side: 1, cut: [[9.5, 71], [12, 79], [14, 88], [0, 88], [0, 71]] },
      { pivot: [102, 75], side: -1, cut: [[103, 71], [99.5, 78], [96, 89], [115, 89], [115, 71]] }
    ],
    eyes: [{ x: 31, y: 30, rx: 6, ry: 8 }, { x: 79, y: 33, rx: 6, ry: 8 }]
  },
  butter: {
    size: [115, 146],
    body: 'rig_butter_body',
    arms: [
      { source: 'rig_butter_Rhand', pivot: [12, 103], side: 1 },
      { source: 'rig_butter_Lhand', pivot: [100, 102], side: -1 }
    ],
    // Fade the supplied larger eye over the body's existing resting pupil.
    // R/L filenames are the character's sides, not the viewer's sides.
    eyes: [{ source: 'rig_butter_eyes', crop: [25, 56, 11, 15],
      x: 28, y: 64, rx: 5.5, ry: 7.5, overlay: true }]
  }
};
const CUPCAKE_RIG_CACHE = {};
function rigCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; return c;
}
function rigPolygon(g, points) {
  g.beginPath(); points.forEach(([x, y], n) => n ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
}
function prepareCupcakeRig(key) {
  if (CUPCAKE_RIG_CACHE[key]) return CUPCAKE_RIG_CACHE[key];
  const profile = CUPCAKE_RIG_PROFILES[key], im = IMG[key];
  if (!profile || !im || im.width !== profile.size[0] || im.height !== profile.size[1]) return null;
  if (profile.body) {
    const keys = [profile.body, ...profile.arms.map(a => a.source), ...profile.eyes.map(e => e.source)];
    if (keys.some(k => !IMG[k] || IMG[k].width !== im.width || IMG[k].height !== im.height)) return null;
    const body = IMG[profile.body];
    const arms = profile.arms.map(a => ({ ...a, art: IMG[a.source] }));
    const eyes = profile.eyes.map(eye => {
      const art = rigCanvas(eye.crop[2], eye.crop[3]);
      art.getContext('2d').drawImage(IMG[eye.source], ...eye.crop, 0, 0, art.width, art.height);
      return { ...eye, art };
    });
    const rest = rigCanvas(im.width, im.height), g = rest.getContext('2d');
    arms.forEach(a => g.drawImage(a.art, 0, 0));
    g.drawImage(body, 0, 0);
    return CUPCAKE_RIG_CACHE[key] = { body, arms, eyes, rest };
  }
  const body = rigCanvas(im.width, im.height), b = body.getContext('2d');
  b.drawImage(im, 0, 0);
  const arms = profile.arms.map(a => {
    const art = rigCanvas(im.width, im.height), g = art.getContext('2d');
    g.save(); rigPolygon(g, a.cut); g.clip(); g.drawImage(im, 0, 0); g.restore();
    b.save(); b.globalCompositeOperation = 'destination-out'; rigPolygon(b, a.cut); b.fill(); b.restore();
    return { ...a, art };
  });
  const eyes = profile.eyes.map(eye => {
    const art = rigCanvas(eye.rx * 2, eye.ry * 2), g = art.getContext('2d');
    g.drawImage(im, eye.x - eye.rx, eye.y - eye.ry, art.width, art.height, 0, 0, art.width, art.height);
    const pixels = g.getImageData(0, 0, art.width, art.height);
    for (let i = 0; i < pixels.data.length; i += 4) {
      // Preserve the original brown pencil grain; exclude surrounding sponge.
      const r = pixels.data[i], green = pixels.data[i + 1], blue = pixels.data[i + 2];
      if (r > 155 || green > 108 || blue > 90) pixels.data[i + 3] = 0;
    }
    g.putImageData(pixels, 0, 0);
    return { ...eye, art };
  });
  return CUPCAKE_RIG_CACHE[key] = { body, arms, eyes, rest: im };
}
function installCupcakeRigs() {
  for (const [key, profile] of Object.entries(CUPCAKE_RIG_PROFILES)) {
    if (!profile.body) continue;
    const rig = prepareCupcakeRig(key);
    // Share the resting composite with tints/outlines. Retain the original foot
    // metadata so switching between normal and rig drawing never shifts it.
    if (rig) IMG[key] = rig.rest;
  }
}
function cupcakeReactionPose(age, reduced = false) {
  if (reduced || age < 0 || age >= 460) return { active: false, arms: 0, eyes: 1 };
  const t = age / 460;
  const envelope = Math.sin(Math.PI * t) ** 0.8;
  // Two small flaps, with a quiet start and finish. Feet never move.
  return {
    active: true,
    arms: envelope * (0.85 + 0.38 * Math.sin(t * Math.PI * 4)),
    eyes: 1 + 0.42 * Math.sin(Math.PI * Math.min(1, age / 360)) ** 0.7
  };
}
function drawCupcakeReaction(g, key, x, by, sc, sx, sy, age, reduced = false) {
  const pose = cupcakeReactionPose(age, reduced);
  if (!pose.active) return false;
  return drawCupcakeRig(g, key, x, by, sc, sx, sy, pose);
}
function drawCupcakeRig(g, key, x, by, sc, sx, sy, pose) {
  const rig = prepareCupcakeRig(key), m = META[key];
  if (!rig || !m) return false;
  g.save(); g.translate(x, by); g.scale(sc * (m.k || 1) * sx, sc * (m.k || 1) * sy);
  g.translate(-m.ax, -m.ay);
  if (pose.arms === 0 && pose.eyes === 1) {
    g.drawImage(rig.rest, 0, 0); g.restore(); return true;
  }
  for (const arm of rig.arms) {
    g.save(); g.translate(...arm.pivot); g.rotate(arm.side * pose.arms);
    g.drawImage(arm.art, -arm.pivot[0], -arm.pivot[1]); g.restore();
  }
  g.drawImage(rig.body, 0, 0);
  for (const eye of rig.eyes) {
    g.save(); g.translate(eye.x, eye.y);
    if (eye.overlay) {
      g.globalAlpha *= Math.max(0, Math.min(1, (pose.eyes - 1) / 0.42));
      g.scale(1 + (pose.eyes - 1) * 0.25, 1 + (pose.eyes - 1) * 0.25);
    } else g.scale(pose.eyes, 1 + (pose.eyes - 1) * 0.55);
    g.drawImage(eye.art, -eye.rx, -eye.ry); g.restore();
  }
  g.restore();
  return true;
}

function cupcakePose(v, time = now, reduced = reduceMotion) {
  if (reduced) return { sx: 1, sy: 1 };
  // A fresh sprite finishes its infection fade at 230 ms. Give the newly
  // revealed zombie its own single squash/stretch instead of inheriting only
  // the tiny tail of the original hit. Deriving this from infAt avoids queued
  // callbacks replaying after undo/restart or extending when a frame is late.
  const revealAge = v.infAt >= 0 ? time - v.infAt - 230 : -1;
  const laterHit = v.bumpAt > v.infAt + 230 && time >= v.bumpAt && time - v.bumpAt < 420;
  if (revealAge >= 0 && revealAge < 380 && !laterHit) {
    const q = revealAge / 380;
    const k = q < 0.28
      ? 0.10 * Math.sin(q / 0.28 * Math.PI) ** 2
      : -0.12 * Math.sin((q - 0.28) / 0.72 * Math.PI) ** 2;
    return { sx: 1 + k * 0.55, sy: 1 - k };
  }
  const p = (time - v.bumpAt) / 420;
  let k = v.bumpAt >= 0 && p >= 0 && p < 1
    ? Math.min(0.12, v.bumpAmp) * Math.sin(p * Math.PI * 2) * (1 - p) ** 2
    : 0;
  const q = (time - v.peekAt) / 300;
  if (!(v.bumpAt >= 0 && p >= 0 && p < 1) && v.peekAt >= 0 && q >= 0 && q < 1) {
    k = q < 0.22 ? 0.035 * Math.sin(q / 0.22 * Math.PI) : -0.06 * Math.sin((q - 0.22) / 0.78 * Math.PI) ** 2;
  }
  return { sx: 1 + k * 0.55, sy: 1 - k };
}
function measure(im) {
  const c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
  const g = c.getContext('2d'); g.drawImage(im, 0, 0);
  const { data } = g.getImageData(0, 0, c.width, c.height);
  let bottom = 0;
  for (let y = c.height - 1; y >= 0 && !bottom; y--) for (let x = 0; x < c.width; x++) if (data[(y * c.width + x) * 4 + 3] > 40) { bottom = y; break; }
  let sx = 0, n = 0;
  const y0 = Math.floor(bottom - c.height * 0.35);
  for (let y = Math.max(0, y0); y <= bottom; y++) for (let x = 0; x < c.width; x++) if (data[(y * c.width + x) * 4 + 3] > 40) { sx += x; n++; }
  return { w: c.width, h: c.height, ax: n ? sx / n : c.width / 2, ay: bottom || c.height };
}
function buildTints() {
  for (const k of ['basic', 'berry', 'sprinkle', 'cherry', 'cream', 'butter_open', 'butter', 'earl_grey', 'lemon_yogurt', 'pending_lemon_yogurt', 'espresso', 'blueberry', 'cinnamon_roll']) {
    const m = META[k], im = IMG[k];
    if (!im) continue;
    const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
    const g = c.getContext('2d');
    g.drawImage(im, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(118, 150, 52, 0.62)';
    g.fillRect(0, 0, m.w, m.h);
    let seed = k.length * 97;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 22; i++) {
      const x = rnd() * m.w, y = m.h * 0.15 + rnd() * m.h * 0.6, r = (4 + rnd() * 11) * m.w / 115;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      const col = rnd() < 0.5 ? '232, 244, 196' : '190, 214, 120';
      gr.addColorStop(0, `rgba(${col}, 0.95)`); gr.addColorStop(1, `rgba(${col}, 0)`);
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
    TINT[k] = c;
  }
}
const cv=document.getElementById('sample'),g=cv.getContext('2d'),slider=document.getElementById('scrub'),ageLabel=document.getElementById('age'),media=matchMedia('(prefers-reduced-motion: reduce)');
const checks={body:document.getElementById('bodyMotion'),arms:document.getElementById('armsMotion'),eyes:document.getElementById('eyesMotion')};
let flavor='butter',frame=null,age=460,ready=false;
function duration(){return flavor==='zombie'?610:460}
function draw(next=duration()){
 age=Math.min(duration(),Math.max(0,next));if(!ready)return;
 const transforming=flavor==='zombie',key=transforming?(age>=230?'zombieB':'basic'):flavor,m=META[key],sc=transforming?2.9:key==='butter'?3.15:3.8;
 const body=checks.body.checked?cupcakePose(transforming?{bumpAt:0,bumpAmp:.12,infAt:0,peekAt:-1}:{bumpAt:-1,peekAt:0},age,media.matches):{sx:1,sy:1};
 const p=transforming?{active:false}:cupcakeReactionPose(age,media.matches);
 if(!checks.arms.checked)p.arms=0;if(!checks.eyes.checked)p.eyes=1;
 g.clearRect(0,0,720,666);g.fillStyle='#ded4bc';g.beginPath();g.ellipse(360,548,156,22,0,0,Math.PI*2);g.fill();
 if(!p.active||!drawCupcakeRig(g,key,360,548,sc,body.sx,body.sy,p)){
   g.save();g.translate(360,548);g.scale(sc*body.sx,sc*body.sy);g.drawImage(IMG[key],-m.ax,-m.ay);
   if(transforming&&age<230){g.globalAlpha=age/230;g.drawImage(TINT.basic,-m.ax,-m.ay)}
   g.restore();
 }
 slider.value=age;ageLabel.textContent=media.matches?'동작 줄이기':age>=duration()?(transforming?'변신 완료':'평소'):Math.round(age)+'ms';
}
function stop(){cancelAnimationFrame(frame);frame=null;}
function play(speed=1){if(!ready)return;stop();if(media.matches){draw();return}const start=performance.now();function tick(t){draw((t-start)/speed);if(age<duration())frame=requestAnimationFrame(tick);else frame=null}frame=requestAnimationFrame(tick)}
document.getElementById('play').onclick=()=>play();document.getElementById('slow').onclick=()=>play(3);cv.onclick=()=>play();
slider.oninput=()=>{stop();draw(Number(slider.value))};
for(const check of Object.values(checks))check.onchange=()=>{if(frame!==null)draw(age);else if(age>=duration())play();else draw(age)};
for(const button of document.querySelectorAll('[data-flavor]'))button.onclick=()=>{
 stop();flavor=button.dataset.flavor;
 for(const b of document.querySelectorAll('[data-flavor]'))b.setAttribute('aria-pressed',String(b===button));
 document.querySelector('h1').textContent=flavor==='butter'?'버터도, 파닥!':'앗, 나 불렀어?';
 document.querySelector('.intro').textContent=flavor==='butter'?'시크한 얼굴로 버티다가… 팔은 솔직하네.':'초코 머핀도 뽀잉과 파닥을 함께.';
 cv.setAttribute('aria-label',(flavor==='butter'?'버터':'초코 머핀')+' 컵케이크. 아래 버튼으로 반응을 재생할 수 있어요.');
 document.getElementById('note').textContent=flavor==='butter'?'모자 아래 눈매와 입은 그대로. 따로 준 큰 눈은 깜짝 놀랄 때만 나타나요.':'기존 그림의 팔과 눈을 분리해서 움직여요. 몸통 뽀잉도 그대로 살아 있어요.';
 document.getElementById('caption').textContent=flavor==='butter'?'분리해 준 원화로 움직여요 · 발 위치는 고정':'초코 머핀 첫 시안 · 발 위치는 고정';
 const transforming=flavor==='zombie';
 slider.max=duration();checks.arms.disabled=transforming;checks.eyes.disabled=transforming;
 document.getElementById('play').textContent=transforming?'좀비로 뽀잉!':'뽀잉 + 파닥!';
 if(transforming){
   document.querySelector('h1').textContent='좀비도, 뽀잉!';
   document.querySelector('.intro').textContent='상한 모습으로 바뀐 다음, 한 번 더 뽀잉.';
   cv.setAttribute('aria-label','초코 머핀의 좀비 변신. 아래 버튼으로 재생할 수 있어요.');
   document.getElementById('note').textContent='색이 변하고 → 좀비가 살짝 눌렸다가 → 뽀잉! 발은 고정하고, 한 번만 움직인 뒤 멈춰요.';
   document.getElementById('caption').textContent='게임과 같은 변신 동작 · 발 위치는 고정';
 }
 draw();
