<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="동작·카메라·빛·소리, 16가지 효과를 켜고 끄며 타격감을 실험하는 게임 데모.">
  <title>Game Feel Lab | Studio Penumbra</title>
  <link rel="canonical" href="https://studio-penumbra.com/impact-lab.html">
  <meta property="og:title" content="Game Feel Lab | Studio Penumbra">
  <meta property="og:description" content="직접 움직이고 쏘며 히트 스톱, 반동, 화면 흔들림과 소리를 비교해 보세요.">
  <meta property="og:url" content="https://studio-penumbra.com/impact-lab.html">
  <meta property="og:type" content="website">
  <link rel="icon" href="favicon-32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+KR:wght@400;500;600&amp;display=swap">
  <link rel="stylesheet" href="impact-lab.css?v=20261125-switches">
  <script defer src="impact-lab-i18n.js?v=20261125-switches"></script>
  <script defer src="impact-lab.js?v=20261125-switches"></script>
  <script defer src="impact-lab-controls.js?v=20261125-switches"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <svg class="brand-symbol" viewBox="0 0 40 40" aria-hidden="true"><path d="M20 2v8M20 30v8M2 20h8M30 20h8"/><path d="M10 10h20v20H10z"/><path class="symbol-center" d="M17 17h6v6h-6z"/></svg>
        <div><p class="eyebrow"><a class="lab-home" href="index.html#lab" aria-label="Studio Penumbra의 Lab 목록으로" data-i18n-aria-label="home">Studio Penumbra / Lab</a></p><h1><span data-i18n="app.name">Game Feel Lab</span></h1></div>
      </div>
      <nav class="toolbar" aria-label="화면 설정" data-i18n-aria-label="toolbar">
        <div class="language-control" role="group" aria-label="언어 선택" data-i18n-aria-label="language"><button type="button" data-language="ko" lang="ko" aria-label="한국어" aria-pressed="true">한글</button><button type="button" data-language="en" lang="en" aria-label="English" aria-pressed="false">EN</button></div>
        <button id="pause-button" class="quiet-button" type="button" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4v12M14 4v12"/></svg><span>일시정지</span></button>
        <button id="reset-button" class="quiet-button" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 7a7 7 0 1 1-1 5M3 3v5h5"/></svg><span>처음부터</span></button>
        <button id="fullscreen-button" class="quiet-button" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M3 13v4h4M17 13v4h-4"/></svg><span>전체 화면</span></button>
        <button id="panel-button" class="quiet-button panel-button" type="button" aria-expanded="true" aria-controls="effect-panel"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="3" width="14" height="14" rx="2"/><path d="M12 3v14"/></svg><span>설정 숨기기</span></button>
      </nav>
    </header>

    <main class="workspace">
      <section class="play-area" aria-label="타격감 게임" data-i18n-aria-label="game">
        <div class="stage" id="stage">
          <canvas id="arena" tabindex="0" aria-label="타격감 연습장. 방향키나 WASD로 이동하고 마우스로 조준합니다. 클릭하면 발사하고 스페이스 키로 근접 공격합니다." data-i18n-aria-label="game.aria" aria-describedby="game-instructions"></canvas>
          <div id="touch-controls" class="touch-controls" aria-label="터치 조작" data-i18n-aria-label="touch">
            <div class="dpad" aria-label="이동" data-i18n-aria-label="move">
              <button type="button" data-move="up" aria-label="위로 이동" data-i18n-aria-label="move.up"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 12 5-5 5 5"/></svg></button>
              <button type="button" data-move="left" aria-label="왼쪽으로 이동" data-i18n-aria-label="move.left"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg></button>
              <button type="button" data-move="down" aria-label="아래로 이동" data-i18n-aria-label="move.down"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 8 5 5 5-5"/></svg></button>
              <button type="button" data-move="right" aria-label="오른쪽으로 이동" data-i18n-aria-label="move.right"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg></button>
            </div>
            <div class="touch-attacks"><button id="touch-melee" type="button" data-i18n="melee">근접</button><button id="touch-fire" type="button" data-i18n="fire">발사</button></div>
          </div>
        </div>
        <footer class="play-footer">
          <p id="game-instructions" class="desktop-instructions"><span><kbd>WASD</kbd><kbd data-i18n="arrows">방향키</kbd> <span data-i18n="move">이동</span></span><span><kbd data-i18n="mouse">마우스</kbd> <span data-i18n="aim">조준 · 클릭 연사</span></span><span><kbd>Space</kbd> <span data-i18n="melee.instruction">근접 공격</span></span></p>
          <p class="mobile-instructions" data-i18n="touch.instruction">화면을 눌러 조준 · 방향 버튼으로 이동</p>
        </footer>
      </section>

      <aside id="effect-panel" class="effect-panel" aria-label="타격 효과 설정" data-i18n-aria-label="effects.aria">
        <div class="panel-heading"><h2 data-i18n="effects.heading">효과 스위치</h2><span id="active-count" class="active-count">16 / 16 켜짐</span></div>
        <div class="preset-controls" aria-label="전체 효과 설정" data-i18n-aria-label="effects.all"><button id="all-on" type="button" data-i18n="effects.on">모두 켜기</button><button id="all-off" type="button" data-i18n="effects.off">모두 끄기</button><label class="auto-control"><input id="auto-toggle" type="checkbox"><span data-i18n="auto">자동 시연</span></label></div>
        <div id="effects" class="effects">
          <fieldset class="effect-group effect-group--motion"><legend data-i18n="group.motion">동작·카메라</legend><div class="effect-grid">
            <label class="effect-tile" data-effect="hitstop" for="toggle-hitstop"><span class="effect-name" data-i18n="effect.hitstop">히트 스톱</span><input id="toggle-hitstop" data-i18n-aria-label="effect.hitstop" type="checkbox" checked aria-describedby="description-hitstop"><span id="description-hitstop" class="sr-only" data-i18n="effect.hitstop.description">맞는 순간 동작을 잠깐 멈추기</span></label>
            <label class="effect-tile" data-effect="shake" for="toggle-shake"><span class="effect-name" data-i18n="effect.shake">화면 흔들림</span><input id="toggle-shake" data-i18n-aria-label="effect.shake" type="checkbox" checked aria-describedby="description-shake"><span id="description-shake" class="sr-only" data-i18n="effect.shake.description">충돌할 때 카메라를 짧게 흔들기</span></label>
            <label class="effect-tile" data-effect="zoom" for="toggle-zoom"><span class="effect-name" data-i18n="effect.zoom">타격 줌</span><input id="toggle-zoom" data-i18n-aria-label="effect.zoom" type="checkbox" checked aria-describedby="description-zoom"><span id="description-zoom" class="sr-only" data-i18n="effect.zoom.description">맞는 순간 화면을 살짝 확대했다가 되돌리기</span></label>
            <label class="effect-tile" data-effect="recoil" for="toggle-recoil"><span class="effect-name" data-i18n="effect.recoil">무기 반동</span><input id="toggle-recoil" data-i18n-aria-label="effect.recoil" type="checkbox" checked aria-describedby="description-recoil"><span id="description-recoil" class="sr-only" data-i18n="effect.recoil.description">공격할 때 무기가 뒤로 움직이기</span></label>
          </div></fieldset>
          <fieldset class="effect-group effect-group--target"><legend data-i18n="group.target">피격 반응</legend><div class="effect-grid">
            <label class="effect-tile" data-effect="knockback" for="toggle-knockback"><span class="effect-name" data-i18n="effect.knockback">넉백</span><input id="toggle-knockback" data-i18n-aria-label="effect.knockback" type="checkbox" checked aria-describedby="description-knockback"><span id="description-knockback" class="sr-only" data-i18n="effect.knockback.description">맞은 표적이 밀렸다가 돌아오기</span></label>
            <label class="effect-tile" data-effect="squash" for="toggle-squash"><span class="effect-name" data-i18n="effect.squash">눌림·복원</span><input id="toggle-squash" data-i18n-aria-label="effect.squash" type="checkbox" checked aria-describedby="description-squash"><span id="description-squash" class="sr-only" data-i18n="effect.squash.description">맞은 표적이 찌그러졌다가 원래 모양으로 돌아오기</span></label>
            <label class="effect-tile" data-effect="flash" for="toggle-flash"><span class="effect-name" data-i18n="effect.flash">피격 점멸</span><input id="toggle-flash" data-i18n-aria-label="effect.flash" type="checkbox" checked aria-describedby="description-flash"><span id="description-flash" class="sr-only" data-i18n="effect.flash.description">맞은 표적을 잠깐 밝게 보여주기</span></label>
            <label class="effect-tile" data-effect="damage" for="toggle-damage"><span class="effect-name" data-i18n="effect.damage">피해 숫자</span><input id="toggle-damage" data-i18n-aria-label="effect.damage" type="checkbox" checked aria-describedby="description-damage"><span id="description-damage" class="sr-only" data-i18n="effect.damage.description">맞힌 위치 위로 피해량을 띄우기</span></label>
          </div></fieldset>
          <fieldset class="effect-group effect-group--visual"><legend data-i18n="group.visual">빛·입자</legend><div class="effect-grid">
            <label class="effect-tile" data-effect="muzzle" for="toggle-muzzle"><span class="effect-name" data-i18n="effect.muzzle">총구 섬광</span><input id="toggle-muzzle" data-i18n-aria-label="effect.muzzle" type="checkbox" checked aria-describedby="description-muzzle"><span id="description-muzzle" class="sr-only" data-i18n="effect.muzzle.description">총을 쏘는 순간 총구에서 빛이 번쩍이기</span></label>
            <label class="effect-tile" data-effect="trail" for="toggle-trail"><span class="effect-name" data-i18n="effect.trail">탄환 궤적</span><input id="toggle-trail" data-i18n-aria-label="effect.trail" type="checkbox" checked aria-describedby="description-trail"><span id="description-trail" class="sr-only" data-i18n="effect.trail.description">날아가는 탄환 뒤에 빛의 꼬리를 남기기</span></label>
            <label class="effect-tile" data-effect="particles" for="toggle-particles"><span class="effect-name" data-i18n="effect.particles">타격 입자</span><input id="toggle-particles" data-i18n-aria-label="effect.particles" type="checkbox" checked aria-describedby="description-particles"><span id="description-particles" class="sr-only" data-i18n="effect.particles.description">맞은 위치에서 작은 빛 조각을 흩뿌리기</span></label>
            <label class="effect-tile" data-effect="shockwave" for="toggle-shockwave"><span class="effect-name" data-i18n="effect.shockwave">충격파</span><input id="toggle-shockwave" data-i18n-aria-label="effect.shockwave" type="checkbox" checked aria-describedby="description-shockwave"><span id="description-shockwave" class="sr-only" data-i18n="effect.shockwave.description">맞은 위치에서 원형 파동이 퍼지기</span></label>
            <label class="effect-tile" data-effect="defeatburst" for="toggle-defeatburst"><span class="effect-name" data-i18n="effect.defeatburst">격파 파편</span><input id="toggle-defeatburst" data-i18n-aria-label="effect.defeatburst" type="checkbox" checked aria-describedby="description-defeatburst"><span id="description-defeatburst" class="sr-only" data-i18n="effect.defeatburst.description">표적의 체력이 0이 되면 큰 파편을 흩뿌리기</span></label>
          </div></fieldset>
          <fieldset class="effect-group effect-group--audio"><legend data-i18n="group.audio">소리</legend><div class="effect-grid">
            <label class="effect-tile" data-effect="shotsound" for="toggle-shotsound"><span class="effect-name" data-i18n="effect.shotsound">공격 소리</span><input id="toggle-shotsound" data-i18n-aria-label="effect.shotsound" type="checkbox" checked aria-describedby="description-shotsound"><span id="description-shotsound" class="sr-only" data-i18n="effect.shotsound.description">발사하거나 근접 공격을 시작할 때 소리 내기</span></label>
            <label class="effect-tile" data-effect="hitsound" for="toggle-hitsound"><span class="effect-name" data-i18n="effect.hitsound">타격 소리</span><input id="toggle-hitsound" data-i18n-aria-label="effect.hitsound" type="checkbox" checked aria-describedby="description-hitsound"><span id="description-hitsound" class="sr-only" data-i18n="effect.hitsound.description">공격이 표적에 맞는 순간 소리 내기</span></label>
            <label class="effect-tile" data-effect="breaksound" for="toggle-breaksound"><span class="effect-name" data-i18n="effect.breaksound">격파 소리</span><input id="toggle-breaksound" data-i18n-aria-label="effect.breaksound" type="checkbox" checked aria-describedby="description-breaksound"><span id="description-breaksound" class="sr-only" data-i18n="effect.breaksound.description">표적의 체력이 0이 되는 순간 소리 내기</span></label>
          </div></fieldset>
        </div>
        <section class="effect-info" aria-label="효과 설명" data-i18n-aria-label="effects.description"><div><strong id="effect-detail-title">히트 스톱</strong><span id="effect-detail-term" lang="en">Hit stop</span></div><p id="effect-detail-copy">맞는 순간 동작을 잠깐 멈추기</p></section>
        <div class="panel-foot"><label class="reduced-control"><input id="reduced-toggle" type="checkbox"><span data-i18n="reduced">움직임 줄이기</span></label><span data-i18n="note.damage">공격력·탄속은 동일</span></div>
      </aside>
    </main>
    <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
  </div>
</body>
</html>
